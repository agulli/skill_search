# fly.toml app configuration file generated for searchskills on 2026-08-31T13:18:27+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'searchskills'
primary_region = 'lhr'

[build]
[env]
  SKILL_ENGINE_CACHE_MB = '192'
  SKILL_ENGINE_DB = '/data/skills.db'
  SKILL_ENGINE_MMAP_MB = '0'
  SKILL_ENGINE_PUBLIC = '1'
  SKILL_ENGINE_RATE = '4'

[[mounts]]
  source = 'corpus'
  destination = '/data'
  initial_size = '15gb'  # only applies at creation; extend an existing volume

[http_service]
  internal_port = 8080
  force_https = true
  # Kept warm rather than suspended, for two measured reasons.
  #
  # Fly judges idleness from HTTP traffic, so a long SSH upload generates none
  # and the machine suspends underneath it — that killed a 2.6GB transfer
  # mid-flight with 'remote command exited without exit status'.
  #
  # And a suspended machine wakes with an empty page cache. On an index this
  # size a cold broad query measured ~13 seconds against ~90ms warm, which is
  # the difference between a working site and a broken-looking one.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '4s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
