# fly.toml app configuration file generated for searchskills on 2026-08-31T13:18:27+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'searchskills'
primary_region = 'lhr'

[build]
[env]
  SKILL_ENGINE_CACHE_MB = '192'
  SKILL_ENGINE_DB = '/data/skills.db'
  SKILL_ENGINE_MMAP_MB = '0'
  SKILL_ENGINE_PUBLIC = '1'
  SKILL_ENGINE_RATE = '4'

[[mounts]]
  source = 'corpus'
  destination = '/data'
  initial_size = '12gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '4s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
