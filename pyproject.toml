[project]
name = "skill-engine"
version = "0.1.0"
description = "A search engine for AI agent skills published on GitHub"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
vectors = ["numpy>=1.24"]
voyage = ["numpy>=1.24", "voyageai>=0.3"]
local = ["numpy>=1.24", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
skill-engine = "skill_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skill_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
